<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simulation</title>
  <link rel="stylesheet" href="styles.css?v=20260822b" />
  <!-- Firebase SDKs -->
  <script type="module" src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/9.6.10/firebase-storage.js"></script>
  <!-- Your Firebase init -->
  <script type="module" src="firebase.js?v=20260722"></script>
  <!-- Simulation logic -->
  <script type="module" src="simulation.js?v=20260822c"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Thin&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

</head>
<body>

  <div id="iframe-overlay" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 9999;
    display: none;
    background: transparent;
    pointer-events: all;
  "></div>
  <!-- Right Panel -->
  <div id="right-panel">
    <!-- Tabs Section (now inside right panel, at the bottom) -->

    <div id="right-panel-toolbar">
      <button id="start" class="material-symbols-outlined">play_arrow</button>
      <button id="stop" title="Stop Simulation">■</button>
    </div>

    <div id="file-explorer">
      <div id="file-explorer-header">
        <span class="explorer-title">Memories</span>
        <div class="maps-actions">
          <button id="find" class="sidebar-action-btn material-symbols-outlined" title="Search memories">search</button>
          <button id="add-map" class="sidebar-action-btn" title="Add New Map">＋</button>
          <button id="remove-map" class="sidebar-action-btn" title="Remove Map">-</button>
        </div>
      </div>

      <!-- Search bar below title -->
      <div id="searchContainer" style="
          display: none;
          background-color: rgba(40, 40, 40, 0.1);
          padding: 5px;
        ">
        <input type="text" id="searchInput" placeholder="Search filename..." style="width: 100%; padding: 4px;">
      </div>

      <ul id="file-list" style="max-height: 300px; overflow-y: auto;">
        <li>Loading files...</li>
      </ul>
      <button class="section-resize-handle" type="button" aria-label="Resize Memories section" title="Drag to resize Memories"></button>
    </div>

    <div id="objects-section">
      <div id="objects-section-header">
        <span class="explorer-title">3D Objects</span>
        <div class="objects-actions">
          <button id="find-objects" class="sidebar-action-btn material-symbols-outlined" title="Search 3D objects">search</button>
          <button id="upload-blend" type="button" class="sidebar-action-btn" title="Upload a 3D object">+</button>
          <button id="remove-object" class="sidebar-action-btn" title="Remove Object">-</button>
        </div>
      </div>
      <div id="object-search-container" class="section-search-container">
        <input type="text" id="object-search-input" placeholder="Search 3D objects...">
      </div>
      <ul id="objects-list" style="max-height: 200px; overflow-y: auto;">
        <li>Loading objects...</li>
      </ul>
      <button class="section-resize-handle" type="button" aria-label="Resize 3D Objects section" title="Drag to resize 3D Objects"></button>
    </div>

  </div>
  <input type="file" id="file-input" accept=".json" style="display: none" />
  <input type="file" id="blend-file-input" accept=".glb,.gltf,.obj,.fbx,.blend,.blend1" hidden />

  <div id="right-panel-glow"></div>

  <!-- Bottom Right Tabs -->
  <div id="tabs">
    <button id="psi-btn" class="tab-btn selected">Ψ</button>
    <button id="sigma-btn" class="tab-btn">Σ</button>
  </div>


  <!-- Simulation Containers -->
  <div id="simulation-container">
    <div id="main-content">
      <div id="psi-container" class="simulation-container">
        <iframe id="psi-iframe" src="psi.html?v=20260605" frameborder="0" scrolling="no" width="100%" height="100%"></iframe>
        <iframe id="psi-iframe" src="psi.html?v=20260605"></iframe>

      </div>

      <div id="sigma-container" class="simulation-container">
        <iframe id="sigma-iframe" src="sigma.html?v=20260719" frameborder="0" scrolling="no" width="100%" height="100%"></iframe>
      </div>
    </div>
  </div>
  
  <!-- Blend Object Selection Modal -->
  <div id="blend-modal" style="display:none;">
    <div id="blend-modal-inner">
      <div id="blend-modal-header">
        <span id="blend-modal-title">Select objects to load</span>
        <button id="blend-modal-close" class="close-btn">×</button>
      </div>
      <div id="blend-modal-body">
        <div id="blend-modal-loading">Loading objects…</div>
        <ul id="blend-object-list"></ul>
      </div>
      <div id="blend-modal-footer">
        <button id="blend-select-all">Select All</button>
        <button id="blend-deselect-all">Deselect All</button>
        <button id="blend-load-btn">Load Selected</button>
      </div>
    </div>
  </div>

  <div id="json-editor">
    <button id="close-json-editor" class="close-btn">×</button>
    <h3></h3>
    <p id="json-filename" style="margin-top: -10px; margin-bottom: 10px; font-size: 14px; color: #ccc;"></p>
    <textarea id="json-textarea"></textarea>
    <div style="display: flex; gap: 10px;">
      <button id="save-json-btn">Save</button>
      <button id="download-json-btn">Download</button>
      <button id="delete-json-btn" style="background: #ff4444; color: white;">Delete</button>
    </div>

  </div>
</body>
</html>
